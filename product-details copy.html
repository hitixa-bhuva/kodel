<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bentley Yappa — Premium Leather</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg-white: #ffffff;
  --bg-soft: #f8fafc;
  --accent-blue: #1a70b4;
  --text-main: #222222;
  --text-muted: #7a7a7a;
  --border-light: #e5e7eb;
}

/* ── COLOR EXPLORER ── */
.section-padding { padding: 100px 80px; }
@media(max-width:640px){ .section-padding { padding: 60px 24px; } }

.color-explorer { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; background: #fff; border: 1px solid var(--border-light); border-radius: 24px; padding: 40px; }
@media(max-width:850px){ .color-explorer { grid-template-columns: 1fr; } }

.swatch-grid { display: flex; flex-wrap: wrap; gap: 12px; margin: 30px 0; }
.swatch { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #fff; outline: 1px solid var(--border-light); cursor: pointer; transition: 0.2s; }
.swatch.active { outline: 2px solid var(--accent-blue); transform: scale(1.1); }

.detail-card { background: var(--bg-soft); border-radius: 16px; padding: 30px; transition: 0.3s; }
.detail-card:hover { background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
.detail-icon { color: var(--accent-blue); margin-bottom: 20px; }
</style>
</head>
<body>


<section class="section-padding bg-slate-50">
  <div class="max-w-7xl mx-auto">
    <h2 class="text-3xl font-bold mb-12 text-center" style="font-family: 'Playfair Display', serif;">The Palette</h2>
    <div class="color-explorer">
      <div>
        <h3 class="text-xl font-semibold mb-4">Curated Textures</h3>
        <p class="text-muted-foreground" style="color: var(--text-muted)">Select a shade to preview the grain and light reflection. Our dyes are UV-stabilized for color longevity.</p>
        
        <div class="swatch-grid" id="swatchGrid">
          </div>

        <div class="mt-8 p-6 border-l-4" style="border-color: var(--accent-blue); background: var(--bg-soft);">
          <p class="text-sm font-bold uppercase tracking-widest mb-1" style="color: var(--accent-blue)">Technical Note</p>
          <p id="colorDesc" style="font-size: 14px; color: var(--text-muted);">A versatile, cool-toned finish ideal for corporate lounges and automotive seating.</p>
        </div>
      </div>
      <div class="flex items-center justify-center">
        <img id="previewImage" src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=800&q=80" class="rounded-xl shadow-lg w-full h-[400px] object-cover transition-all duration-500" alt="Preview">
      </div>
    </div>
  </div>
</section>

<script>
const colors = [
  { name: 'Sapphire Blue', hex: '#1a70b4', img: 'https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=800&q=80', desc: 'The signature Bentley Blue. Deep, professional, and commanding.' },
  { name: 'Graphite Grey', hex: '#7a7a7a', img: 'https://images.unsplash.com/photo-1554034483-04fda0d3507b?w=800&q=80', desc: 'A neutral industrial tone that highlights modern furniture silhouettes.' },
  { name: 'Pure Onyx', hex: '#222222', img: 'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=800&q=80', desc: 'Deepest black with a subtle matte sheen for high-end luxury interiors.' },
  { name: 'Slate Blue', hex: '#4a6fa5', img: 'https://images.unsplash.com/photo-1550584552-463ff780763c?w=800&q=80', desc: 'A softer, muted blue that brings a sense of calm to office spaces.' },
  { name: 'Silver Cloud', hex: '#d1d5db', img: 'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=800&q=80', desc: 'Bright and airy. Perfect for minimal "Apple-style" retail environments.' }
];

const swatchGrid = document.getElementById('swatchGrid');
const mainImage = document.getElementById('mainImage');
const previewImage = document.getElementById('previewImage');
const colorLabel = document.getElementById('colorLabel');
const colorDesc = document.getElementById('colorDesc');

colors.forEach((color, index) => {
  const btn = document.createElement('button');
  btn.className = `swatch ${index === 0 ? 'active' : ''}`;
  btn.style.backgroundColor = color.hex;
  btn.onclick = () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    
    // Update Content
    mainImage.style.opacity = '0';
    previewImage.style.opacity = '0';
    
    setTimeout(() => {
      mainImage.src = color.img;
      previewImage.src = color.img;
      colorLabel.textContent = color.name;
      colorDesc.textContent = color.desc;
      mainImage.style.opacity = '1';
      previewImage.style.opacity = '1';
    }, 300);
  };
  swatchGrid.appendChild(btn);
});
</script>

</body>
</html>
